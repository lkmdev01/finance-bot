[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:laravel-web]
command=php artisan serve --host=0.0.0.0 --port=8000
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/laravel-web.out.log
stderr_logfile=/var/log/supervisor/laravel-web.err.log

[program:laravel-worker]
command=php artisan queue:work --tries=3 --timeout=120
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/laravel-worker.out.log
stderr_logfile=/var/log/supervisor/laravel-worker.err.log

[program:laravel-scheduler]
command=php artisan schedule:work
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/laravel-scheduler.out.log
stderr_logfile=/var/log/supervisor/laravel-scheduler.err.log

[program:whatsapp-service]
command=npm start
directory=/var/www/html/whatsapp-service
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/whatsapp.out.log
stderr_logfile=/var/log/supervisor/whatsapp.err.log
